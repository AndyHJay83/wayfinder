name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    name: iOS build and unit tests
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Build the branch itself (not the PR merge commit) so the generated
          # Xcode project can be committed back to it.
          ref: ${{ github.head_ref || github.ref }}

      - name: Select Xcode
        run: |
          # Mapbox ships binaries built with Swift 6.2, so Xcode 26 or newer is required.
          XCODE=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          if [ -z "$XCODE" ]; then ls -d /Applications/Xcode*.app; echo "::error::No Xcode 26+ found"; exit 1; fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Mapbox SDK download credentials
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: |
          if [ -z "$MAPBOX_DOWNLOADS_TOKEN" ]; then
            echo "::error::MAPBOX_DOWNLOADS_TOKEN secret is not set"; exit 1
          fi
          printf 'machine api.mapbox.com\nlogin mapbox\npassword %s\n' "$MAPBOX_DOWNLOADS_TOKEN" > ~/.netrc
          chmod 600 ~/.netrc

      - name: CI Secrets.xcconfig (placeholders only)
        run: |
          cat > Secrets.xcconfig <<'EOF'
          MAPBOX_ACCESS_TOKEN = pk.ci-placeholder
          WAYFINDER_BUNDLE_ID = com.example.wayfinder
          EOF

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: .spm
          key: spm-${{ hashFiles('project.yml') }}

      - name: Pick a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              if "iOS" not in runtime: continue
              for d in devices[runtime]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit()
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator $UDID"

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Wayfinder.xcodeproj \
            -scheme Wayfinder \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -clonedSourcePackagesDirPath .spm \
            CODE_SIGNING_ALLOWED=NO \
            -IDEBuildingContinueBuildingAfterErrors=YES \
            2>&1 | tee xcodebuild.log | grep -E "error:|warning: .*deprecated|Test Case|Executed|BUILD|\*\*" | grep -v "^$" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" xcodebuild.log

      - name: Commit generated Xcode project
        # Keeps Wayfinder.xcodeproj in the repo so it can be opened straight from Xcode.
        # Pushes made with GITHUB_TOKEN don't trigger another CI run.
        if: success() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          git add Wayfinder.xcodeproj Wayfinder/Info.plist Wayfinder/Wayfinder.entitlements
          if git diff --cached --quiet; then echo "Xcode project unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update generated Xcode project"
          git push origin "HEAD:${{ github.head_ref || github.ref_name }}"

      - name: Show compiler errors
        if: failure()
        run: grep -E "error:" xcodebuild.log | sort -u | head -150 || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore

  supabase:
    name: Edge Function tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/sync-fuel/index.ts supabase/functions/parking-osm/index.ts supabase/functions/places-osm/index.ts supabase/functions/plan-trip/index.ts
      - run: deno test supabase/functions/tests/
